<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm | HK Store</title>
  <meta name="description" content="Chi tiết sản phẩm thời trang Streetwear HK Store. Chọn size, màu sắc và đặt hàng trực tuyến tiện lợi." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/chatbot.css?v=20261110v14" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/fashion-features.css" />
</head>
<body>
  <div id="hk-header"></div>

  <main class="container">
    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="Đường dẫn trang">
      <a href="index.html">Trang chủ</a>
      <span class="breadcrumb-separator">/</span>
      <a href="products.html" id="breadcrumb-category-link">Sản phẩm</a>
      <span class="breadcrumb-separator">/</span>
      <span class="text-primary font-bold" id="breadcrumb-product-name">Chi tiết</span>
    </nav>

    <!-- Khung chi tiết sản phẩm -->
    <div class="product-detail-layout" id="product-detail-layout">
      <!-- Cột Trái: Gallery Ảnh -->
      <div class="detail-gallery">
        <div class="main-image-wrap" id="detail-main-img-wrap" title="Nhấn để phóng to ảnh">
          <img id="detail-main-img" src="assets/images/placeholder.svg" alt="Sản phẩm" class="main-image" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='assets/images/placeholder.svg'" />
          <button type="button" class="zoom-hint-btn" id="btn-zoom-main-img" aria-label="Phóng to ảnh sản phẩm">
            <svg style="width: 15px; height: 15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            Phóng to
          </button>
        </div>
        <div class="gallery-thumbs" id="detail-thumbs-wrap"></div>
      </div>

      <!-- Cột Phải: Thông tin & Thao tác chọn biến thể -->
      <div class="detail-info">
        <div>
          <h1 class="detail-title" id="detail-title">Đang tải...</h1>
          <div class="detail-meta-row" style="margin-top: 8px;">
            <div id="detail-rating"></div>
            <span>•</span>
            <span class="text-success font-bold">Thiết kế chính hãng HK Store</span>
          </div>
        </div>

        <div class="detail-price-box">
          <span class="detail-price" id="detail-price">0₫</span>
          <span class="detail-price-original" id="detail-price-original" style="display:none;">0₫</span>
        </div>

        <!-- Bộ chọn SIZE -->
        <div>
          <div class="selector-label">
            <span>Kích cỡ (Size)</span>
            <button type="button" class="size-guide-link" id="btn-size-guide" style="display: inline-flex; align-items: center; gap: 4px;">
              <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/></svg>
              Bảng thông số chọn size
            </button>
          </div>
          <div class="variant-picker-grid" id="size-picker-container"></div>
        </div>

        <!-- Bộ chọn MÀU SẮC -->
        <div>
          <div class="selector-label">
            <span>Màu sắc</span>
          </div>
          <div class="variant-picker-grid" id="color-picker-container"></div>
        </div>

        <!-- Trạng thái tồn kho thời gian thực -->
        <div>
          <div id="variant-stock-indicator" class="stock-indicator">Đang kiểm tra tồn kho...</div>
        </div>

        <!-- Bộ chọn SỐ LƯỢNG -->
        <div>
          <div class="selector-label"><span>Số lượng</span></div>
          <div class="qty-control">
            <button type="button" class="qty-btn" id="btn-qty-minus" aria-label="Giảm số lượng">-</button>
            <input type="number" id="input-qty" class="qty-input" value="1" min="1" max="99" aria-label="Số lượng sản phẩm" />
            <button type="button" class="qty-btn" id="btn-qty-plus" aria-label="Tăng số lượng">+</button>
          </div>
        </div>

        <!-- Nút hành động Mua & Thêm Giỏ -->
        <div class="detail-actions">
          <button type="button" class="btn btn-secondary btn-lg" id="btn-add-to-cart">
            Thêm vào giỏ hàng
          </button>
          <button type="button" class="btn btn-primary btn-lg" id="btn-buy-now">
            Mua ngay
          </button>
        </div>

        <!-- Thông tin chi tiết & Chất liệu -->
        <div class="product-specs-list">
          <h2 style="font-size: 0.96rem; letter-spacing: 0; margin-bottom: 4px; font-weight: 800;">Thông số &amp; Bảo quản</h2>
          <p id="detail-desc" style="line-height: 1.6; color: var(--color-muted); margin-bottom: 8px;"></p>
          <p><strong>Chất liệu:</strong> <span id="detail-material"></span></p>
          <p><strong>Form dáng:</strong> <span id="detail-fit"></span></p>
          <p><strong>Bảo quản:</strong> <span id="detail-care">Giặt nhẹ ở nhiệt độ thường, lộn trái khi giặt và phơi trong bóng râm.</span></p>
        </div>
      </div>
    </div>

    <!-- Đánh giá thực tế từ khách hàng & Cảm nhận form dáng -->
    <section class="pdp-reviews-section" id="product-reviews-section"></section>

    <!-- Sản phẩm liên quan -->
    <section style="margin-top: var(--space-3xl); margin-bottom: var(--space-3xl); border-top: 1px solid var(--color-border); padding-top: var(--space-xl);">
      <div class="section-header">
        <h2 class="section-title">SẢN PHẨM CÙNG DANH MỤC</h2>
      </div>
      <div class="products-grid" id="related-products-grid"></div>
    </section>

    <!-- Sản phẩm vừa xem gần đây -->
    <section class="hk-recently-viewed-section" id="hk-recently-viewed-detail" style="display: none;"></section>
  </main>

  <div id="hk-footer"></div>

  <script src="assets/js/seed.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/email-service.js?v=20261110v14"></script>
  <script src="assets/js/media-storage.js?v=20261110v14"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/orders.js"></script>
  <script src="assets/js/fashion-features.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/chatbot.js?v=20261110v14"></script>
  <script src="assets/js/pages/product-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập tài khoản | HK Store</title>
  <meta name="description" content="Đăng nhập tài khoản HK Store để quản lý đơn hàng thời trang và thanh toán nhanh chóng." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/chatbot.css?v=20261110v15" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/fashion-features.css" />
</head>
<body>
  <div id="hk-header"></div>

  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h1 class="auth-title">ĐĂNG NHẬP</h1>
        <p class="text-muted">Chào mừng bạn quay trở lại với HK Store</p>
      </div>

      <!-- Thông báo ngữ cảnh khi chuyển hướng từ Thanh toán / Tài khoản -->
      <div id="login-context-banner" class="auth-context-banner hidden"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Địa chỉ Email <span class="required">*</span></label>
          <input type="email" id="login-email" class="form-control" autocomplete="email" required placeholder="name@example.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu <span class="required">*</span></label>
          <input type="password" id="login-password" class="form-control" autocomplete="current-password" required placeholder="Nhập mật khẩu" />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: var(--space-lg);">
          ĐĂNG NHẬP
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-xl); font-size: 0.9rem;">
        <span class="text-muted">Chưa có tài khoản?</span>
        <a href="register.html" id="login-register-link" class="font-bold text-primary" style="text-decoration: underline; margin-left: 4px;">
          Đăng ký ngay
        </a>
      </div>
    </div>
  </main>

  <div id="hk-footer"></div>

  <script src="assets/js/seed.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/cloud-db.js?v=20261110v15"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/email-service.js?v=20261110v15"></script>
  <script src="assets/js/media-storage.js?v=20261110v15"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/orders.js"></script>
  <script src="assets/js/fashion-features.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/chatbot.js?v=20261110v15"></script>
  <script src="assets/js/pages/login-page.js"></script>
</body>
</html>
